# SchedLock deployment.
#
# The quick start needs no configuration: bring the stack up and the first-run
# wizard sets the admin password and generates the secrets, storing them in
# /data/config.yaml. The environment variables below are optional overrides for
# deployments that prefer to configure everything ahead of time.

services:
  schedlock:
    build:
      context: .
      args:
        VERSION: ${SCHEDLOCK_VERSION:-dev}
    image: schedlock:${SCHEDLOCK_VERSION:-dev}
    container_name: schedlock
    restart: unless-stopped

    ports:
      - "${SCHEDLOCK_PORT:-8080}:8080"

    volumes:
      - schedlock_data:/data

    environment:
      # The public address of this instance. Approval links point here, and it
      # must match the redirect URI registered with Google.
      SCHEDLOCK_BASE_URL: ${SCHEDLOCK_BASE_URL:-http://localhost:8080}

      # Secrets. Leave unset to have the setup wizard generate and persist them.
      SCHEDLOCK_SERVER_SECRET: ${SCHEDLOCK_SERVER_SECRET:-}
      SCHEDLOCK_ENCRYPTION_KEY: ${SCHEDLOCK_ENCRYPTION_KEY:-}
      SCHEDLOCK_AUTH_PASSWORD_HASH: ${SCHEDLOCK_AUTH_PASSWORD_HASH:-}

      # Google OAuth. These can also be entered in Settings after first run.
      SCHEDLOCK_GOOGLE_CLIENT_ID: ${SCHEDLOCK_GOOGLE_CLIENT_ID:-}
      SCHEDLOCK_GOOGLE_CLIENT_SECRET: ${SCHEDLOCK_GOOGLE_CLIENT_SECRET:-}

      # Behind a reverse proxy, list its address so forwarded client IPs are
      # believed. Leave empty when SchedLock is reached directly.
      SCHEDLOCK_TRUSTED_PROXIES: ${SCHEDLOCK_TRUSTED_PROXIES:-}

      SCHEDLOCK_LOG_LEVEL: ${SCHEDLOCK_LOG_LEVEL:-info}
      SCHEDLOCK_LOG_FORMAT: ${SCHEDLOCK_LOG_FORMAT:-json}
      SCHEDLOCK_DISPLAY_TIMEZONE: ${SCHEDLOCK_DISPLAY_TIMEZONE:-UTC}

    # The process needs no elevated capability: it listens on 8080 as an
    # unprivileged user and writes only to its data volume.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: expose SchedLock through a Cloudflare Tunnel, so approval links
  # work from a phone without opening a port.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: schedlock-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - schedlock

  # Optional: continuous backup of the SQLite database. See litestream.yml.
  # litestream:
  #   image: litestream/litestream:0.3
  #   container_name: schedlock-litestream
  #   restart: unless-stopped
  #   volumes:
  #     - schedlock_data:/data
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #   command: replicate
  #   depends_on:
  #     - schedlock

volumes:
  schedlock_data:
